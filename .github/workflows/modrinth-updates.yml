
name: Modrinth Update Notifications

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check Modrinth and notify BotGhost
        env:
          BOTGHOST_WEBHOOK_URL: ${{ secrets.BOTGHOST_WEBHOOK_URL }}
          BOTGHOST_API_KEY: ${{ secrets.BOTGHOST_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          project = "create-teszt-hez"
          api = f"https://api.modrinth.com/v2/project/{project}/version"
          request = urllib.request.Request(
              api, headers={"User-Agent": "CreateTesztHez-UpdateChecker/1.0"}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              versions = json.load(response)

          if not versions:
              raise SystemExit("No versions found")

          latest = max(versions, key=lambda v: v["date_published"])
          version_id = latest["id"]

          if not os.environ.get("BOTGHOST_WEBHOOK_URL"):
              raise SystemExit("Missing BOTGHOST_WEBHOOK_URL secret")

          # GitHub Actions cache is configured in a later step.
          print("Latest Modrinth version:", latest["version_number"])
          print("Version ID:", version_id)
          PY
